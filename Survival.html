</script><script>/* Lightweight orthographic 3D geometry, projected into Canvas; no external engine. */
function drawSurvival3D(c,s,zoom=1){
 const faces=[],cx=zoom>1?s.player.x:480,cy=zoom>1?s.player.y:320,project=(x,y,z=0)=>({x:480+((x-cx)*.72-(y-cy)*.33)*zoom,y:350+((x-cx)*.2+(y-cy)*.5-z*.9)*zoom});

 function box(x,y,z,w,d,h,color,angle=0){

  for(const dz of [0,h])for(const [dx,dy] of [[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]])v.push([x+dx*cs-dy*sn,y+dx*sn+dy*cs,z+dz]);

  for(const [indices,shade] of [[[0,1,5,4],.65],[[1,2,6,5],.8],[[2,3,7,6],.85],[[3,0,4,7],.7],[[4,5,6,7],1]]){
   const points=indices.map(i=>v[i]),depth=points.reduce((n,p)=>n+p[0]*.2+p[1]*.5+p[2]*.32,0)/4;

 c.fillStyle='#0d1d23';c.fillRect(0,0,960,640);

 function unit(u,player){
  const angle=u.angle||0,cs=Math.cos(angle),sn=Math.sin(angle),scale=u.kind==='brute'?1.4:u.kind==='runner'?.85:1;
  const gait=player&&!u.moving?0:Math.sin(s.time*(player?14:u.speed*.15)+(u.id||0))*4;
  function part(fwd,side,z,w,d,h,col){box(u.x+(fwd*cs-side*sn)*scale,u.y+(fwd*sn+side*cs)*scale,z*scale,w*scale,d*scale,h*scale,col,angle);}

  part(gait,-6,0,13,7,6,'202e32');part(-gait,6,0,13,7,6,'202e32');
  part(gait*.4,-6,6,8,7,15,armor);part(-gait*.4,6,6,8,7,15,armor);
  part(0,0,19,13,21,19,armor);part(7,0,21,4,16,13,player?'2b3e43':armor);
  part(player?3:10,-14,23,player?9:19,6,7,armor);part(player?3:10,14,23,player?9:19,6,7,armor);
  part(0,0,39,15,16,12,player?'99a68a':'b3b98b');
  part(8,0,41,2,12,4,player?'152c35':'e16d52');
  if(player){part(0,-12,31,9,5,4,'76edd9');part(0,12,31,9,5,4,'76edd9');part(13,7,28,27,4,4,'1c2c35');part(27,7,29,10,2,2,'253d45');part(0,0,52,5,10,1,'76edd9');}
 }
 for(const e of s.enemies)unit(e,false);unit(s.player,true);
 faces.sort((a,b)=>a.depth-b.depth);for(const f of faces)poly(f.points,f.color);
 for(const shot of s.shots){const a=project(shot.x,shot.y,30),b=project(shot.tx,shot.ty,25);c.strokeStyle='#ffe498';c.lineWidth=3;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}
 for(const e of s.enemies){const q=project(e.x,e.y);if(q.x>=16&&q.x<=944&&q.y>=16&&q.y<=624)continue;const dx=q.x-480,dy=q.y-320,k=Math.min(460/Math.max(1,Math.abs(dx)),300/Math.max(1,Math.abs(dy)));c.save();c.translate(480+dx*k,320+dy*k);c.rotate(Math.atan2(dy,dx));c.fillStyle=e.kind==='runner'?'#ffc075':'#f49c87';c.beginPath();c.moveTo(9,0);c.lineTo(-6,-5);c.lineTo(-6,5);c.closePath();c.fill();c.restore();}
// Clear position cue remains visible during contact damage.
 const p=project(s.player.x,s.player.y);c.strokeStyle=s.player.inv>0?'#ffb29c':'#8ef3df';c.lineWidth=2;c.beginPath();c.ellipse(p.x,p.y,15,6,0,0,Math.PI*2);c.stroke();
}
</script><script>'use strict';
function operator(c,x,y,angle,step,team,firing,selected){

c.save();c.translate(x,y);c.fillStyle='#0007';c.beginPath();c.ellipse(2,4,20,16,0,0,Math.PI*2);c.fill();if(selected){c.strokeStyle='#9df5e0';c.lineWidth=2;c.strokeRect(-26,-26,52,52);}c.rotate(angle);
function part(x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h);}
// Articulated boots and trouser legs.
part(-12,8+stride,9,15,'#59644e');part(3,8-stride,9,15,'#59644e');part(-13,18+stride,10,6,'#182325');part(3,18-stride,10,6,'#182325');
part(-13,-7,26,25,'#626f55');part(-11,-5,22,23,'#273a39');part(-14,3,5,12,'#708064');part(9,3,5,12,'#708064');
// Plate carrier, shoulder panels, magazine pouches, belt.
part(-8,-2,16,14,'#455447');part(-8,5,4,9,'#a0a083');part(-2,5,4,9,'#879477');part(4,5,4,9,'#9ba083');part(-11,17,22,4,'#151f22');part(-17,-6,6,14,'#758165');part(11,-6,6,14,'#758165');part(-18,-7,5,5,accent);part(13,-7,5,5,accent);
// Arms, gloves and carbine at the shoulder.
c.strokeStyle='#68765a';c.lineWidth=7;c.lineCap='round';c.beginPath();c.moveTo(-14,-4);c.lineTo(-12,-17);c.lineTo(0,-23);c.moveTo(14,-4);c.lineTo(13,-16);c.lineTo(5,-24);c.stroke();part(-2,-27,7,7,'#19272a');part(2,-35+(firing?2:0),5,27,'#101c21');part(0,-22,9,8,'#29383b');part(3,-42+(firing?2:0),3,9,'#11191e');part(1,-29,7,3,'#748078');
// Helmet, headset, night-vision mounting bracket.
c.fillStyle='#99a183';c.beginPath();c.ellipse(0,-10,10,11,0,0,Math.PI*2);c.fill();part(-11,-14,4,9,'#263c3e');part(7,-14,4,9,'#263c3e');part(-6,-18,12,4,'#56694f');part(-3,-22,6,5,'#26383b');part(-4,-6,8,3,accent);
if(firing){c.fillStyle='#ffdf83';c.beginPath();c.moveTo(4,-44);c.lineTo(-3,-51);c.lineTo(3,-49);c.lineTo(5,-59);c.lineTo(8,-49);c.lineTo(12,-52);c.lineTo(8,-43);c.fill();}c.restore();}
const canvas=document.getElementById('game'),c=canvas.getContext('2d'),$=id=>document.getElementById(id),B=Survival;
let s=B.create(),running=false,paused=false,lang='en',keys=new Set(),touch=null,previous=0,acc=0,scores=[],storageOK=true,lastScore=null,nameSaved=false;
try{const data=JSON.parse(localStorage.getItem('breachline.survival.s2.scores')||'[]');scores=B.readScores(data);}catch{storageOK=false;}
const words={en:{intro:'LAST STAND · One life. Survive the infected. WASD / arrows to move. Touch: drag on the movement pad BELOW the arena to keep the view clear. Your operator fires at the closest threat automatically.',start:'Start run',restart:'New run',pause:'Pause',resume:'Resume',ready:'Stay moving. New waves every 20 seconds.',dead:'Run ended. One life. No revive.',paused:'Paused — resume when ready.',local:'Local times only — editable, not a verified global ranking.',time:'Time',hp:'Health',wave:'Wave',kills:'Kills'},de:{intro:'LAST STAND · Ein Leben. Überlebe die Infizierten. WASD / Pfeiltasten: bewegen. Touch: auf der Steuerfläche UNTER der Karte ziehen, damit die Sicht frei bleibt. Dein Operator feuert automatisch auf die nächste Bedrohung.',start:'Run starten',restart:'Neuer Run',pause:'Pause',resume:'Weiter',ready:'Bleib in Bewegung. Neue Wellen alle 20 Sekunden.',dead:'Run beendet. Ein Leben. Keine Wiederbelebung.',paused:'Pausiert — weiter, wenn du bereit bist.',local:'Nur lokale Zeiten — manipulierbar, keine verifizierte globale Rangliste.',time:'Zeit',hp:'Gesundheit',wave:'Welle',kills:'Abschüsse'}};
function ui(){const t=words[lang];$('moveLabel').textContent=lang==='en'?'Drag here to move':'Hier zum Bewegen ziehen';$('nameLabel').textContent=lang==='en'?'Name for this local run':'Name für diesen lokalen Run';$('saveName').textContent=nameSaved?(lang==='en'?'Saved locally':'Lokal gespeichert'):(lang==='en'?'Save name':'Name speichern');if(!touch)$('moveKnob').style.transform='';$('nameNote').textContent=lang==='en'?'Optional. Stored on this device only. Not uploaded.':'Optional. Nur auf diesem Gerät gespeichert. Wird nicht hochgeladen.';$('namePanel').hidden=!s.dead;$('upgrades').hidden=!s.upgrade;$('upgradeTitle').textContent=lang==='en'?'Field upgrade · time is paused':'Feldausrüstung · Zeit pausiert';$('damage').textContent=lang==='en'?'+50% base damage':'+50% Basisschaden';$('rate').textContent=lang==='en'?'15% shorter shot delay':'15% kürzere Schusspause';$('heal').textContent=lang==='en'?'Recover 40 health':'40 Gesundheit heilen';$('intro').textContent=t.intro;$('start').textContent=s.dead?t.restart:t.start;$('start').hidden=running;$('pause').hidden=!running;$('pause').textContent=paused?t.resume:t.pause;$('language').textContent=lang==='en'?'Deutsch':'English';$('status').textContent=s.dead?t.dead:paused?t.paused:t.ready;$('time').textContent=t.time+' '+s.time.toFixed(1)+'s';$('health').textContent=t.hp+' '+s.player.hp;$('wave').textContent=t.wave+' '+s.wave;$('kills').textContent=t.kills+' '+s.kills;$('scores').textContent=t.local+' '+''+(storageOK?'':' / Storage unavailable');}
function saveScores(){try{if(lastScore)localStorage.setItem('breachline.survival.s2.lastRun',JSON.stringify(lastScore));localStorage.setItem('breachline.survival.s2.scores',JSON.stringify(scores));}catch{storageOK=false;}const list=$('scoreList');list.replaceChildren();for(const row of scores){const item=document.createElement('li');item.textContent=row.name+' — '+row.time.toFixed(1)+'s';list.append(item);}}
function finish(){running=false;keys.clear();touch=null;nameSaved=false;lastScore={time:Math.round(s.time*10)/10,name:'Operator'};scores.push(lastScore);scores.sort((a,b)=>b.time-a.time);scores=scores.slice(0,5);$('playerName').value='';saveScores();ui();}

function frame(now){const dt=Math.min(.1,(now-previous)/1000||0);previous=now;if(running&&!paused){acc+=dt;while(acc>=1/60&&!s.dead){let x=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0),y=(keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('w')||keys.has('ArrowUp')?1:0);if(touch){x=touch.dx;y=touch.dy;}const worldX=(.5*x+.33*y),worldY=(-.2*x+.72*y),length=Math.hypot(worldX,worldY),strength=Math.min(1,Math.hypot(x,y));B.step(s,{x:length?worldX/length*strength:0,y:length?worldY/length*strength:0},1/60);acc-=1/60;}if(s.dead)finish();}else acc=0;draw();ui();requestAnimationFrame(frame);}
$('start').onclick=()=>{s=B.create();running=true;paused=false;acc=0;keys.clear();touch=null;canvas.focus({preventScroll:true});};$('pause').onclick=()=>{paused=!paused;keys.clear();touch=null;if(!paused)canvas.focus({preventScroll:true});};$('language').onclick=()=>{lang=lang==='en'?'de':'en';document.documentElement.lang=lang;ui();};
window.addEventListener('keydown',e=>{if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){if(['BUTTON','INPUT','TEXTAREA'].includes(e.target.tagName))return;e.preventDefault();keys.add(e.key);}});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>{keys.clear();touch=null;if(running)paused=true;});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){paused=true;keys.clear();touch=null;}});
